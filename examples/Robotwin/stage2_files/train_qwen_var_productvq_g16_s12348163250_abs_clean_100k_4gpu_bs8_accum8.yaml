run_id: qwen_var_productvq_g16_s12348163250_robotwin_abs_clean_100k_4gpu_bs8_accum8_fullcache
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: smap
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.24"

framework:
  name: QwenVARScaleParallel
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-VARAction
    attn_implementation: flash_attention_2
  stage1_tokenizer:
    artifact: playground/Checkpoints/var_stage1_robotwin_abs_clean_e64_aeinit_productvq_g16_s1_2_4_8_16_32_50/best_recon.ckpt
    stage1_config: examples/Robotwin/train_files/train_var_stage1_robotwin_abs_clean_e64_aeinit_productvq_g16_s1_2_4_8_16_32_50.yaml
    freeze: true
    token_cache: playground/Checkpoints/var_stage1_robotwin_abs_clean_e64_aeinit_productvq_g16_s1_2_4_8_16_32_50/stage2_token_cache_full.pt
    # Stage1 raw vector order is L,LG,R,RG; StarVLA RoboTwin policy stats use L,R,LG,RG.
    decoded_action_reorder: [0, 1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 6, 13]
  action_token_text:
    prefix: "<var_action_"
    suffix: ">"
  parallel_head:
    num_cross_attention_layers: 2
    num_attention_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    code_condition_dropout: 0.0
    label_smoothing: 0.02
    classifier: per_factor

datasets:
  vla_data:
    dataset_py: var_stage2_token_dataset
    data_mix: robotwin_clean_50
    per_device_batch_size: 8
    num_workers: 4
    shuffle: true
    mode: train
    window_mode: full

trainer:
  pretrained_checkpoint: null
  is_resume: true
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  checkpoint_retention_policy: latest_and_best
  checkpoint_keep_best: 4
  checkpoint_keep_latest: 1
  checkpoint_metric: token_accuracy
  checkpoint_metric_mode: max
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  metric_ema_beta: 0.98
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
