experiment:
  name: var_stage1_robocasa_gr1_abs_productvq_g16_s124816_e256_closebalanced_mtr_incremental_e20
  output_dir: /root/feihong/starVLA_github/Checkpoints/var_stage1_robocasa_gr1_abs_productvq_g16_s124816_e256_closebalanced_mtr_incremental_e20
  seed: 42

data:
  starvla_config_yaml: examples/Robocasa_tabletop/train_files/starvla_cotrain_robocasa_gr1.yaml
  data_root_dir: /root/tianyi/LDA-1B/playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
  data_mix: fourier_gr1_unified_1000
  video_backend: torchvision_av
  expected_action_horizon: 16
  expected_action_dim: 29
  action_mode: abs
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false
  load_all_data_for_training: true
  delete_pause_frame: false

model:
  type: var_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 256
  codebook_size: 512
  scales: [1, 2, 4, 8, 16]
  use_dilated: true
  quant_resi: 0.0
  commitment_cost: 0.2
  normalize_codebook_for_lookup: false
  decoder_head_type: plain
  quantization_mode: product_vq
  product_codebook_groups: 16
  use_time_embedding: true
  use_action_type_embedding: true
  input_embedding_scale: 1.0

loss:
  recon_weight: 1.0
  vel_weight: 0.25
  jerk_weight: 0.0
  scale_weight: 0.1
  position_scale_weight: 1.0
  rotation_scale_weight: 1.0
  gripper_scale_weight: 0.0
  vq_weight: 0.05
  vq_warmup_epochs: 20
  weight_normalization: mean
  sample_weighting:
    enabled: true
    close_task_weight: 4.0
    late_phase_weight: 2.0
    close_late_weight: 1.25
    late_phase_start_ratio: 0.5
    max_weight: 10.0
    normalization: mean
  time_weighting:
    enabled: true
    late_timestep_start: 8
    late_timestep_weight: 2.0
  task_balance_weighting:
    enabled: true
    power: 0.5
    min_weight: 0.5
    max_weight: 2.0
    normalize_mean: true
  adaptive_task_weighting:
    enabled: true
    scope: task
    metric: mae
    baseline: mean
    power: 1.0
    min_weight: 0.5
    max_weight: 3.0
    normalize_mean: true
    min_count: 1024

train:
  # Twenty fresh optimization epochs from the epoch-99 tokenizer weights.
  epochs: 20
  batch_size: 512
  num_workers: 8
  # Keep the effective learning rate from the final Stage1 continuation.
  learning_rate: 4.0e-5
  weight_decay: 1.0e-5
  grad_clip: 1.0
  shuffle: true
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.30
  save_every_epochs: 1
  # Resume the interrupted incremental MTR run, including optimizer/history.
  resume_checkpoint: /root/feihong/starVLA_github/Checkpoints/var_stage1_robocasa_gr1_abs_productvq_g16_s124816_e256_closebalanced_mtr_incremental_e20/latest.ckpt
  init_codebook_from_data_batches: 0
  init_codebook_noise_scale: 0.0
  freeze_encoder_decoder_epochs: 0
  track_reconstruction_by_task: true
  save_reconstruction_by_task_every_epoch: true
  device: cuda
